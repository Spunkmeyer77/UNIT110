# Builds UNIT 110 on macOS, Windows and Linux.
# - every push / pull request: builds + installers, downloadable under the run's "Artifacts"
# - every push to main (or a tag like v1.0.0): also publishes the GitHub Release v<version from CMakeLists.txt>
#   with all installers, the manual and the update history attached
name: Build UNIT 110

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15-intel
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Windows
            os: windows-2022
            configure: ""
          - name: Linux
            os: ubuntu-22.04
            configure: -DCMAKE_BUILD_TYPE=Release -DT110_BUILD_TESTS=ON
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Read version
        run: echo "VERSION=$(sed -nE 's/^project\(UNIT110 VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DT110_COPY_PLUGINS=OFF ${{ matrix.configure }}

      - name: Build
        run: |
          set +e
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "## Build errors (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE "error|fatal|undefined reference|unresolved" build.log | grep -v "warning" | head -60 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -iE " error |error:|fatal error|unresolved external" build.log | head -10 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $status

      # ---- tests / validation ------------------------------------------------------------
      - name: Run plug-in tests (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p test-out
          xvfb-run -a build/UNIT110Test_artefacts/Release/UNIT110Test test-out

      - name: Check minimum macOS version
        if: runner.os == 'macOS'
        run: |
          # x86_64 should need 10.13, arm64 11.0 (the lowest Apple silicon allows). Nothing may need more than macOS 12.
          for f in "build/UNIT110_artefacts/Release/AU/UNIT 110.component/Contents/MacOS/UNIT 110" \
                   "build/UNIT110_artefacts/Release/VST3/UNIT 110.vst3/Contents/MacOS/UNIT 110" \
                   "build/UNIT110_artefacts/Release/Standalone/UNIT 110.app/Contents/MacOS/UNIT 110"; do
            for arch in x86_64 arm64; do
              v=$(otool -arch $arch -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} /LC_VERSION_MIN_MACOSX/ {m=1} b && $1=="minos" {print $2; exit} m && $1=="version" {print $2; exit}')
              echo "::notice::$(basename "$(dirname "$(dirname "$(dirname "$f")")")") $arch needs macOS $v"
              major=${v%%.*}
              if [ -z "$v" ] || { [ "$major" -gt 12 ] && [ "$major" -ne 10 ]; }; then echo "::error::$f $arch needs macOS $v"; exit 1; fi
            done
          done

      - name: Validate Audio Unit (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/UNIT110_artefacts/Release/AU/UNIT 110.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu U110 Trlb

      # ---- packaging ---------------------------------------------------------------------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x tools/make_pkg.sh
          ./tools/make_pkg.sh
          mv "dist/UNIT110-$VERSION.pkg" "dist/UNIT110-$VERSION-macOS.pkg"
          cd build/UNIT110_artefacts/Release
          ditto -c -k --keepParent "AU/UNIT 110.component" "$GITHUB_WORKSPACE/dist/UNIT110-$VERSION-macOS-AU.zip"
          ditto -c -k --keepParent "VST3/UNIT 110.vst3" "$GITHUB_WORKSPACE/dist/UNIT110-$VERSION-macOS-VST3.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "installer\windows\UNIT110.iss" 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) {
            "## Inno Setup errors" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content iscc.log -Tail 30 | ForEach-Object { "::error::$_" }
            exit $LASTEXITCODE
          }
          Compress-Archive -Path "build\UNIT110_artefacts\Release\VST3\UNIT 110.vst3" `
                           -DestinationPath "dist\UNIT110-$env:VERSION-Windows-VST3.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/package_linux.sh
          ./tools/package_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: UNIT110-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        run: echo "VERSION=$(sed -nE 's/^project\(UNIT110 VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: UNIT 110 ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            UNIT 110 ${{ env.VERSION }} by Transistor Labs. Installers for macOS (.pkg), Windows (.exe) and Linux (.tar.gz), plus the manual and the update history.
            macOS: the installer is not notarised; see "macOS security warning" in the manual.
